[package]
name    = "bastion-agent-runtime"
version = "0.4.0"
edition = "2021"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
# async_trait marks every boxed-future trait method `#[must_use]`; clippy
# 1.99 reports that as `double_must_use` on each trait definition. The
# attribute is generated, not written here.
double_must_use = { level = "allow", priority = 1 }

[dependencies]
bastion-sandbox = { path = "../bastion-sandbox" }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
thiserror   = "2"
anyhow      = "1"
async-trait = "0.1"
sha2        = "0.10"
semver      = "1"
tracing     = "0.1"
tokio       = { version = "1", features = ["time", "fs", "sync", "macros", "rt", "process", "io-util"] }
# A-06 direct-ACP adapter: the official Zed SDK, pinned exact — the project went
# 0.15 -> 1.0 -> 2.0 in a single month, so every bump is deliberate adapter work,
# never a silent `^` upgrade.
agent-client-protocol = "=2.0.0"

[dev-dependencies]
tokio     = { version = "1", features = ["time", "fs", "sync", "macros", "rt", "rt-multi-thread", "process", "io-util", "test-util"] }
tempfile  = "3"

# Custom main: the test binary doubles as the sandbox helper (it forwards
# `__bastion-sandbox` to `bastion_sandbox::helper_main`), exactly the way a
# host binary does.
[[test]]
name    = "harness_confinement"
harness = false


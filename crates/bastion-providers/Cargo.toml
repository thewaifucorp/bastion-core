[package]
name    = "bastion-providers"
version = "0.2.4"
edition = "2021"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

# Versions identical to the workspace root — the crate carries only what the
# moved files actually use (audited import-by-import in M2 step 5).
[dependencies]
bastion-types   = { path = "../bastion-types" }
bastion-runtime = { path = "../bastion-runtime" }
tokio           = { version = "1", features = ["full"] }
async-openai    = { version = "0.38", features = ["chat-completion"] }
reqwest         = { version = "0.13", features = ["json", "stream", "form"] }
async-trait     = "0.1"
# codex.rs decodes the id_token JWT's base64url payload to read the
# chatgpt_account_id claim — same version already used workspace-wide
# (crates/bastion-mesh/Cargo.toml).
base64          = "0.22"
futures-util    = "0.3"
anyhow          = "1"
serde_json      = "1"
tracing         = "0.1"
github-copilot-sdk = "1.0.8"
# PKCE pair generation for copilot.rs's authorization-code flow — version
# matches the existing workspace-wide pin (crates/bastion-mcp/Cargo.toml).
rand            = "0.8"
# Same crate/version bastion-runtime, bastion-mesh, bastion-agent-runtime and
# bastion-extension-protocol already pin; copilot.rs uses it for the PKCE
# S256 code_challenge. copilot.rs builds the authorize URL with
# `reqwest::Url` (reqwest re-exports `url::Url`) rather than adding a
# separate `url` dependency.
sha2            = "0.10"

[dev-dependencies]
# Test-only (ollama.rs's GBNF-diagnostic test builds a schemars schema for
# `bastion_types::CabinetVerdict`).
schemars = "0.8"

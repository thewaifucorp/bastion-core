[package]
name    = "bastion-types"
version = "0.4.0"
edition = "2021"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
# async_trait marks every boxed-future trait method `#[must_use]`; clippy
# 1.99 reports that as `double_must_use` on each trait definition. The
# attribute is generated, not written here.
double_must_use = { level = "allow", priority = 1 }

[dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror  = "2"
anyhow     = "1"
# M2 step 5: CabinetVerdict/Dissent need JsonSchema — a pure-data type moved
# here from src/cabinet/synth.rs so bastion-providers' ollama.rs diagnostic
# test can reference it without depending on product-level Cabinet logic.
schemars   = "0.8"

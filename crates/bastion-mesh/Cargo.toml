[package]
name    = "bastion-mesh"
version = "0.1.0"
edition = "2021"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

# Versions identical to the workspace root — the crate carries only what the
# moved files actually use (audited import-by-import in M2 step 6).
[dependencies]
bastion-types     = { path = "../bastion-types" }
bastion-runtime   = { path = "../bastion-runtime" }
bastion-memory    = { path = "../bastion-memory" }
# interop::{export,import} construct/read GoalEngine and Persona/PersonaRegistry
# directly (the .af agent-file format spans cognition + personas data).
bastion-cognition = { path = "../bastion-cognition" }
bastion-personas  = { path = "../bastion-personas" }
anyhow            = "1"
async-trait       = "0.1"
age               = "0.11"
base64            = "0.22"
chrono            = { version = "0.4", default-features = false, features = ["clock"] }
ed25519-dalek     = { version = "2", features = ["rand_core"] }
opentelemetry     = { version = "0.32", features = ["trace"] }
reqwest           = { version = "0.13", features = ["json", "stream"] }
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
sha2              = "0.10"
tokio             = { version = "1", features = ["full"] }
tracing           = "0.1"
# Multi-device (src/devices): primary<->node frames over WebSocket + TLS.
futures-util      = "0.3"
rand_core         = { version = "0.6", features = ["getrandom"] }
rustls            = { version = "0.23", default-features = false, features = ["std"] }
thiserror         = "2"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
tokio-util        = "0.7"
# Replica (src/devices): the event log and the encrypted replica file.
chacha20poly1305  = "0.10"
rusqlite          = { version = "0.39", features = ["bundled"] }
zeroize           = "1"

[dev-dependencies]
bastion-memory = { path = "../bastion-memory" }
tempfile    = "3"
rcgen       = "0.13"
tokio-rustls = "0.26"
rustls      = { version = "0.23", features = ["aws_lc_rs"] }

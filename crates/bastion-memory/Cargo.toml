[package]
name    = "bastion-memory"
version = "0.1.1"
edition = "2021"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
# async_trait marks every boxed-future trait method `#[must_use]`; clippy
# 1.99 reports that as `double_must_use` on each trait definition. The
# attribute is generated, not written here.
double_must_use = { level = "allow", priority = 1 }

# Versions identical to the workspace root — the crate carries only what the
# moved files actually use (audited import-by-import in M2 step 4).
[dependencies]
bastion-types   = { path = "../bastion-types" }
bastion-runtime = { path = "../bastion-runtime" }
async-trait     = "0.1"
rusqlite        = { version = "0.39", features = ["bundled"] }
serde_json      = "1"
tokio           = { version = "1", features = ["full"] }
anyhow          = "1"

[dev-dependencies]
tempfile = "3"

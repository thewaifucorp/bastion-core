name: model-prices

# BUP-06: the packaged model price table is refreshed by a pull request, never
# downloaded at run time. Weekly, or on demand for a specific upstream ref.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      ref:
        description: "langfuse/langfuse ref (branch, tag or commit)"
        required: false
        default: main

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh the price table
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/update-model-prices.sh "${{ github.event.inputs.ref || 'main' }}"
      - name: Open a pull request when it changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- crates/bastion-runtime/pricing; then
            echo "price table unchanged"
            exit 0
          fi
          version="$(python3 -c 'import json; print(json.load(open("crates/bastion-runtime/pricing/upstream.json"))["version"])')"
          branch="chore/model-prices-${version#langfuse@}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "branch $branch already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add crates/bastion-runtime/pricing
          git commit -m "chore(runtime): refresh model price table to ${version}"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore(runtime): refresh model price table to ${version}" \
            --body "Automated refresh of \`crates/bastion-runtime/pricing/langfuse-model-prices.json\` from langfuse/langfuse (\`scripts/update-model-prices.sh\`). The file is vendored unmodified; review the diff for removed or repriced models before merging."

name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  crate-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-crate-deps.sh

  rust:
    needs: crate-deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test

  # BMD-07: the workspace builds, lints and passes its tests for
  # x86_64-pc-windows-msvc. BMD-05: the confinement suites run under the
  # AppContainer backend and may not skip (the runner is elevated, so the
  # loopback case is checked in both directions).
  windows:
    needs: crate-deps
    runs-on: windows-latest
    env:
      BASTION_SANDBOX_TESTS_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace

  # Examples must stay buildable against the substrate crates
  # alone (they never depend on the root `bastion` package) — a cheap check
  # that the public API remains sufficient for an external consumer.
  examples:
    needs: crate-deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check -p minimal-agent -p embedded-host

  # Fail loudly when a
  # crate's public surface (docs/api-baseline/<crate>.txt) drifts from the
  # working tree without the baseline being regenerated and committed.
  # See docs/VERSIONING.md for what a baseline diff means for versioning.
  public-api-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/dump-public-api.sh --check

  # The kernel code must never gain a billing/
  # marketplace/tenancy/control-plane SYMBOL, and no tracked file may
  # reintroduce a scrubbed corporate name. Cheap (no toolchain needed).
  scope-and-scrub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-scope-and-scrub.sh
